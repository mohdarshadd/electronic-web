name: Keep site awake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping VoltCart
        run: |
          URL="https://elecweb.onrender.com"
          curl -sf -o /dev/null -w "GET $URL -> HTTP %{http_code}\n" "$URL"