name: Keep site awake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping VoltCart
        run: |
          URL="https://elecweb.onrender.com"
          curl -sSf --max-time 60 -o /dev/null -w "GET $URL -> HTTP %{http_code} in %{time_total}s\n" "$URL"